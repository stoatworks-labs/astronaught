name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# macOS only, and deliberately. The CMakeLists branches on APPLE and WIN32 and
# has no Linux path at all, so ubuntu is not an option; Windows needs GLEW from
# vcpkg, which is a slow, fragile thing to put in front of every pull request
# for a compile break that would almost certainly show up on macOS too. The
# release workflow still builds both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # ASTRONAUGHT_BUILD_TOOLS is ON here where the release build turns it OFF:
        # astest is a large slice of the C++ and carries the only mirror of
        # the plugin's maths, so compiling it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DASTRONAUGHT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      # The checks that need no GL context, which is the set a CI runner can
      # be trusted with. astest skips context creation entirely when only these
      # are asked for, so this needs no software GL stack.
      #
      # ☠️ `--drag` is the one to keep here above all the others. It is the
      # check for the single decision the whole plugin rests on -- that the tape
      # is indexed by position and not by time -- and a change that breaks it
      # still renders a plausible picture, still passes a smoke test, and would
      # otherwise only be found by somebody who knew what a Space Echo is
      # supposed to do. `--modes` is the other: it is the only assertion here
      # about a fact in the world rather than about this code agreeing with
      # itself.
      #
      # Everything else in tools/verify.sh renders, and a software GL stack on a
      # hosted runner is not the thing to hang a merge gate on -- those run
      # locally before a tag.
      - name: The machine, where it needs no GPU
        run: ./build/astest --modes --ratios --delay --rate --drag --chorus --names

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: astronaught-macos-arm64
          path: build/*.bundle
          if-no-files-found: error
