  <body>
    <main id="demo">
      <noscript>
        <h1>Astronaught</h1>
        <p>
          A model of the Roland RE-201 Space Echo as an FFGL effect for
          Resolume: a loop of tape, three playback heads bolted on at equal
          intervals, a twelve-position Mode Selector and a three-spring tank,
          with your picture as the signal on the tape.
        </p>
        <p>
          This demo runs the plugin's shaders and a port of its CPU half in your
          browser, so it needs JavaScript and WebGL2. The plugin itself, its
          source and its downloads are on
          <a href="https://github.com/stoatworks-labs/astronaught">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/astronaught/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/astronaught/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/astronaught">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>

    <script type="module" src="./plugin.js"></script>
